<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>プレイ統計</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
  <style>
    :root {
      color-scheme: light;
      --surface-0: #f3f2ee; --surface-1: #fcfcfb; --line: #e2e0da; --grid: #ecebe6;
      --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
      --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --accent: #2a78d6;
      --up: #1d7a3a; --down: #b3412e;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --surface-0: #121211; --surface-1: #1a1a19; --line: #2e2e2c; --grid: #262624;
        --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
        --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --accent: #3987e5;
        --up: #5cc77d; --down: #ef8a75;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --surface-0: #121211; --surface-1: #1a1a19; --line: #2e2e2c; --grid: #262624;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --accent: #3987e5;
      --up: #5cc77d; --down: #ef8a75;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--surface-0); color: var(--text-primary); font: 14px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0; flex: 1 1 auto; }
    h1 small { display: block; font-size: 12px; font-weight: 400; color: var(--text-secondary); }
    h2 { font-size: 15px; margin: 0 0 2px; }
    .sub { color: var(--text-secondary); font-size: 12px; margin: 0 0 10px; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface-1); }
    .seg button { border: 0; background: none; padding: 6px 12px; font: inherit; color: var(--text-secondary); cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    button.plain { border: 1px solid var(--line); background: var(--surface-1); color: var(--text-primary); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
    .card { background: var(--surface-1); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .tile { background: var(--surface-1); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .tile .k { font-size: 12px; color: var(--text-secondary); }
    .tile .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
    .tile .d { font-size: 12px; color: var(--text-muted); }
    .tile .d .up { color: var(--up); } .tile .d .down { color: var(--down); }
    .tile.live { border-color: var(--accent); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
    .grid2 .card { margin-bottom: 0; }
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); margin: 2px 0 6px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; opacity: 0; transition: opacity .1s; z-index: 2; }
    .tip b { font-variant-numeric: tabular-nums; }
    .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--text-secondary); font-weight: 600; }
    .scroll { overflow-x: auto; }
    .totals { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--text-secondary); margin-top: 8px; }
    .totals b { color: var(--text-primary); font-size: 15px; }
    #login { max-width: 380px; margin: 12vh auto; }
    #login input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--surface-0); color: var(--text-primary); margin: 8px 0; }
    .err { color: var(--down); font-size: 13px; min-height: 1.3em; }
    .hidden { display: none !important; }
    summary { cursor: pointer; }
    .tile .v small { font-size: 14px; }
    .empty { color: var(--text-muted); font-size: 13px; padding: 20px 0; text-align: center; }
  </style>
</head>
<body>
  <main>
    <section id="login" class="card hidden">
      <h2>プレイ統計</h2>
      <p class="sub">管理用の鍵を入力してください。この端末のブラウザに保存されます。</p>
      <form id="login-form">
        <input id="key" type="password" autocomplete="current-password" placeholder="管理用の鍵" />
        <button class="plain" type="submit">表示する</button>
      </form>
      <p id="login-err" class="err"></p>
    </section>

    <div id="dash" class="hidden">
      <header>
        <h1>Hover Tank Arena プレイ統計<small id="updated">日本時間</small></h1>
        <div class="seg" id="range"><button data-d="7">7日</button><button data-d="30">30日</button><button data-d="90">90日</button></div>
        <button class="plain" id="reload" type="button">更新</button>
        <button class="plain" id="logout" type="button">鍵を消す</button>
      </header>

      <div class="tiles" id="tiles"></div>

      <div class="card">
        <h2>日別の人数</h2>
        <p class="sub">「開いた人」＝ゲームを開いた端末の数、「遊んだ人」＝試合を最後まで遊んだ端末の数</p>
        <div class="legend" id="lg-people"></div>
        <div class="chart" id="ch-people"></div>
      </div>

      <div class="grid2" style="margin-bottom:14px">
        <div class="card"><h2>日別の試合数</h2><p class="sub">人が1人以上いた試合（CPUだけの試合は数えない）</p><div class="chart" id="ch-matches"></div></div>
        <div class="card"><h2>日別のプレイ時間</h2><p class="sub">全員の試合時間の合計（縦軸は分）</p><div class="chart" id="ch-minutes"></div></div>
      </div>

      <div class="grid2" style="margin-bottom:14px">
        <div class="card"><h2>レベル分布</h2><p class="sub">試合を1回以上遊んだ人の、いまのレベル</p><div class="chart" id="ch-levels"></div><div class="totals" id="totals"></div></div>
        <div class="card"><h2>試合の内訳</h2><p class="sub" id="kinds-sub"></p><div class="scroll"><table id="kinds"></table></div></div>
      </div>

      <details class="card">
        <summary><h2 style="display:inline">日別の数字（表）</h2></summary>
        <div class="scroll" style="margin-top:8px"><table id="daily"></table></div>
      </details>
    </div>
  </main>
  <script type="module" src="./admin.js"></script>
</body>
</html>
